name: Build extension bundles

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      # Sieve (unlike BlockNSFW) generates two bundles at build time. Rebuild
      # them from source so CI fails if the toxicity model or the vendored
      # cookie engine no longer compiles — not just if a committed file changed.
      - name: Build toxicity model bundle
        shell: pwsh
        run: npm run build

      - name: Build cookie engine + rules
        shell: pwsh
        run: node build-cookie-engine.mjs

      - name: Package Chrome build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build-chrome.ps1 -Zip

      - name: Package Firefox build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build-firefox.ps1 -Zip

      - name: Validate expected outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "dist\chrome\manifest.json",
            "dist\chrome\background\service-worker.js",
            "dist\chrome\content\cookie-engine.bundle.js",
            "dist\chrome\content\toxic-model.bundle.js",
            "dist\chrome\data\cookie-rules.json",
            "dist\chrome\rules\gambling-rules.json",
            "dist\chrome\popup\popup.html",
            "dist\chrome\options\options.html",
            "dist\firefox\manifest.json",
            "dist\firefox\background\service-worker.js",
            "dist\firefox\content\cookie-engine.bundle.js",
            "dist\firefox\data\cookie-rules.json",
            "dist\firefox\rules\gambling-rules.json",
            "dist\firefox\popup\popup.html",
            "dist\firefox\options\options.html"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing build output: $path" }
          }

          # content\toxic-model.bundle.js is 638 KB of TensorFlow.js whose only
          # consumer is the offscreen document, and Firefox has no
          # chrome.offscreen. It is REQUIRED in the Chrome build (above) and
          # must be ABSENT from the Firefox one -- asserted rather than assumed,
          # because nothing at runtime would complain if it came back.
          foreach ($path in @("dist\firefox\content\toxic-model.bundle.js",
                              "dist\firefox\offscreen")) {
            if (Test-Path $path) {
              throw "Chrome-only payload leaked into the Firefox build: $path"
            }
          }

          # Dev-only trees must never be shipped.
          $forbidden = @("node_modules", "src", "vendor", "test", "_metadata")
          foreach ($browser in @("chrome", "firefox")) {
            foreach ($dir in $forbidden) {
              $p = "dist\$browser\$dir"
              if (Test-Path $p) { throw "Dev-only path leaked into build: $p" }
            }
          }

          # Each build must carry the correct manifest.
          if ((Get-Content "dist\chrome\manifest.json" -Raw) -notmatch '"service_worker"') {
            throw "Chrome manifest is missing the service_worker background."
          }
          if ((Get-Content "dist\firefox\manifest.json" -Raw) -notmatch '"gecko"') {
            throw "Firefox manifest is missing browser_specific_settings.gecko."
          }

      - name: Content-script size budget
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # A REGRESSION GUARD, not a target.
          #
          # Sieve injects script into every page the user visits, so the size of
          # that injection is a user-facing cost in a way the rest of the
          # package is not: it is parsed per page, and the all_frames half is
          # parsed again per iframe. A performance pass took the top-frame
          # figure from 289,133 bytes to 118,528 and the subframe figure from
          # 48,700 to 36,557. Without something asserting it, that erodes a few
          # kilobytes at a time and nobody notices until it is back where it
          # started -- which nearly happened DURING that pass, when comments
          # added to the all_frames scripts briefly pushed the subframe figure
          # above where it began.
          #
          # MEASURE FROM A CLEAN CHECKOUT, which is what this step does and what
          # a working tree may not be. .gitattributes normalises line endings on
          # checkout, so a tree whose files are already LF reports a couple of
          # kilobytes less than the CRLF files CI and every fresh clone actually
          # build. Both figures above are clean-checkout numbers; measuring a
          # local tree instead is how the first version of them came out ~2 KB
          # light.
          #
          # Headroom is deliberate (roughly 18%) so ordinary work does not trip
          # it. If a change genuinely needs more room, raise the number here in
          # the same commit and say why -- the point is that it becomes a
          # decision instead of a drift.
          #
          # Only <all_urls> entries count. A script scoped to youtube.com is not
          # a cost on every page, so it is not what this measures.
          $TOP_FRAME_BUDGET = 140000
          $SUBFRAME_BUDGET  = 45000

          $manifest = Get-Content "dist\chrome\manifest.json" -Raw | ConvertFrom-Json
          $topOnly = 0
          $everyFrame = 0

          foreach ($cs in $manifest.content_scripts) {
            $matchList = @($cs.matches)
            if ($matchList.Count -ne 1 -or $matchList[0] -ne '<all_urls>') { continue }

            $bytes = 0
            foreach ($file in (@($cs.js) + @($cs.css))) {
              if (-not $file) { continue }
              $bytes += (Get-Item (Join-Path "dist\chrome" $file)).Length
            }
            if ($cs.all_frames) { $everyFrame += $bytes } else { $topOnly += $bytes }
          }

          $perTopFrame = $topOnly + $everyFrame
          $thirtyIframes = $perTopFrame + ($everyFrame * 30)

          Write-Host ("  every top frame : {0,9:N0} bytes  (budget {1,9:N0})" -f $perTopFrame, $TOP_FRAME_BUDGET)
          Write-Host ("  every subframe  : {0,9:N0} bytes  (budget {1,9:N0})" -f $everyFrame, $SUBFRAME_BUDGET)
          Write-Host ("  30-iframe page  : {0,9:N0} bytes  (informational)" -f $thirtyIframes)

          $over = @()
          if ($perTopFrame -gt $TOP_FRAME_BUDGET) {
            $over += "top-frame injection is $perTopFrame bytes, over the $TOP_FRAME_BUDGET budget"
          }
          if ($everyFrame -gt $SUBFRAME_BUDGET) {
            $over += "subframe injection is $everyFrame bytes, over the $SUBFRAME_BUDGET budget"
          }
          if ($over.Count -gt 0) {
            foreach ($line in $over) { Write-Host "BUDGET EXCEEDED: $line" }
            throw "Content-script size budget exceeded. Either trim the injection or raise the budget in this step, in the same commit, with a reason."
          }
          Write-Host "  within budget"

      - name: Lint Firefox build with web-ext
        shell: pwsh
        run: |
          # A COUNT GUARD, in the same spirit as the size budget above.
          #
          # This step used to be continue-on-error with text output, which meant
          # it could never fail and nobody read it. Every warning it currently
          # reports has been checked by hand and is benign, so failing on "any
          # warning" would be noise -- but staying silent means a genuinely NEW
          # warning is invisible. So the baseline is pinned instead: known
          # warnings stay quiet, a new one fails the build.
          #
          # What the 17 are, as of this commit:
          #   6  UNSAFE_VAR_ASSIGNMENT (innerHTML) -- every one is a module
          #      constant or already escapeHtml()'d. No user input, no page
          #      content, and no blocked-list entry reaches any of them.
          #   9  UNSUPPORTED_API -- Chrome-only APIs on the Firefox build, all
          #      guarded: getMatchedRules behind feedbackAvailable(),
          #      dom.openOrClosedShadowRoot behind a chrome.dom check in
          #      vendored Consent-O-Matic, and offscreen.* behind
          #      hasOffscreenDoc(), which returns false where chrome.offscreen
          #      does not exist.
          #   2  KEY_FIREFOX_*_UNSUPPORTED_BY_MIN_VERSION -- gecko
          #      data_collection_permissions needs Firefox 140 while
          #      strict_min_version is 128. DELIBERATE: the key is ignored on
          #      older Firefox rather than fatal, AMO requires the declaration,
          #      and raising the minimum to 140 would drop Firefox ESR 128 --
          #      the long-term-support release institutions run. Do not "fix"
          #      this by bumping strict_min_version.
          #
          # If a change legitimately adds one, check it the same way, then raise
          # the baseline here in the same commit and say what it is.
          $WARNING_BASELINE = 17

          # web-ext exits non-zero whenever it reports anything at all, so its
          # exit code is not the signal -- the count is. Capture and read that.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $raw = npx --yes web-ext lint --source-dir dist/firefox --output json
          $ErrorActionPreference = "Stop"

          $report = ($raw -join "`n") | ConvertFrom-Json
          $errorCount   = [int]$report.summary.errors
          $warningCount = [int]$report.summary.warnings
          $noticeCount  = [int]$report.summary.notices

          Write-Host ("  errors {0} | warnings {1} | notices {2}   (warning baseline {3})" -f $errorCount, $warningCount, $noticeCount, $WARNING_BASELINE)

          $all = @($report.errors) + @($report.warnings) + @($report.notices) | Where-Object { $_ }
          if ($all.Count -gt 0) {
            Write-Host ""
            $all | Group-Object code | Sort-Object Count -Descending | ForEach-Object {
              Write-Host ("  {0,3} x {1}" -f $_.Count, $_.Name)
              $_.Group | Select-Object -First 3 | ForEach-Object {
                $where = $_.file
                if ($_.line) { $where = "$where`:$($_.line)" }
                Write-Host ("        {0}" -f $where)
              }
              if ($_.Count -gt 3) { Write-Host ("        ... and {0} more" -f ($_.Count - 3)) }
            }
            Write-Host ""
          }

          if ($errorCount -gt 0) {
            throw "web-ext lint reported $errorCount error(s). Errors block an AMO submission -- fix them."
          }
          if ($warningCount -gt $WARNING_BASELINE) {
            throw "web-ext lint reported $warningCount warnings, up from the $WARNING_BASELINE known-benign ones. Check the new one, then either fix it or raise the baseline in this step with a note saying what it is."
          }
          if ($warningCount -lt $WARNING_BASELINE) {
            Write-Host "  NOTE: $warningCount warnings, below the $WARNING_BASELINE baseline. Lower WARNING_BASELINE in this step so the guard stays tight."
          } else {
            Write-Host "  at the known-benign baseline"
          }

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: sieve-chrome
          path: |
            dist/chrome
            dist/sieve-chrome.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: sieve-firefox
          path: |
            dist/firefox
            dist/sieve-firefox.zip
